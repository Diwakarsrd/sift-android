name: Build Sift APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - run: yes | sdkmanager --licenses || true

      - run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - run: echo "sdk.dir=$ANDROID_SDK_ROOT" > sift-app/local.properties

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: sift-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Sift-debug-apk
          path: sift-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
