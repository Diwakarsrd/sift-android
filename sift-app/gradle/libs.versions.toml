[versions]
agp                  = "8.3.2"
kotlin               = "1.9.24"
coreKtx              = "1.13.1"
lifecycle            = "2.8.4"
activityCompose      = "1.9.1"
composeBom           = "2024.06.00"
hilt                 = "2.51.1"
hiltNavigationCompose= "1.2.0"
room                 = "2.6.1"
workManager          = "2.9.0"
onnxRuntime          = "1.18.0"
okhttp               = "4.12.0"
kotlinxSerialization = "1.7.1"
kotlinxCoroutines    = "1.8.1"
sqlcipher            = "4.5.4"
datastore            = "1.1.1"
navigation           = "2.7.7"
sentry               = "7.12.0"
timber               = "5.0.1"
splashscreen         = "1.0.1"
junit                = "4.13.2"
junitExt             = "1.2.1"
espresso             = "3.6.1"
mockk                = "1.13.11"
turbine              = "1.1.0"

[libraries]
androidx-core-ktx           = { group = "androidx.core",         name = "core-ktx",                      version.ref = "coreKtx" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle",    name = "lifecycle-runtime-ktx",         version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",    name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
activity-compose            = { group = "androidx.activity",     name = "activity-compose",              version.ref = "activityCompose" }
compose-bom                 = { group = "androidx.compose",      name = "compose-bom",                   version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",   name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",   name = "ui-graphics" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",   name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons      = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling          = { group = "androidx.compose.ui",   name = "ui-tooling" }
compose-ui-test-manifest    = { group = "androidx.compose.ui",   name = "ui-test-manifest" }
compose-ui-test-junit4      = { group = "androidx.compose.ui",   name = "ui-test-junit4" }
navigation-compose          = { group = "androidx.navigation",   name = "navigation-compose",            version.ref = "navigation" }
hilt-android                = { group = "com.google.dagger",     name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",     name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",         name = "hilt-navigation-compose",       version.ref = "hiltNavigationCompose" }
hilt-work                   = { group = "androidx.hilt",         name = "hilt-work",                     version.ref = "hiltNavigationCompose" }
hilt-compiler-work          = { group = "androidx.hilt",         name = "hilt-compiler",                 version.ref = "hiltNavigationCompose" }
room-runtime                = { group = "androidx.room",         name = "room-runtime",                  version.ref = "room" }
room-ktx                    = { group = "androidx.room",         name = "room-ktx",                      version.ref = "room" }
room-compiler               = { group = "androidx.room",         name = "room-compiler",                 version.ref = "room" }
workmanager-ktx             = { group = "androidx.work",         name = "work-runtime-ktx",              version.ref = "workManager" }
onnx-runtime                = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android",       version.ref = "onnxRuntime" }
okhttp                      = { group = "com.squareup.okhttp3",  name = "okhttp",                        version.ref = "okhttp" }
okhttp-logging              = { group = "com.squareup.okhttp3",  name = "logging-interceptor",           version.ref = "okhttp" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json",   version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",   version.ref = "kotlinxCoroutines" }
sqlcipher                   = { group = "net.zetetic",           name = "sqlcipher-android",             version.ref = "sqlcipher" }
sqlite-ktx                  = { group = "androidx.sqlite",       name = "sqlite-ktx",                    version = "2.4.0" }
datastore-preferences       = { group = "androidx.datastore",    name = "datastore-preferences",         version.ref = "datastore" }
sentry-android              = { group = "io.sentry",             name = "sentry-android",                version.ref = "sentry" }
timber                      = { group = "com.jakewharton.timber", name = "timber",                       version.ref = "timber" }
splashscreen                = { group = "androidx.core",         name = "core-splashscreen",             version.ref = "splashscreen" }
junit                       = { group = "junit",                 name = "junit",                         version.ref = "junit" }
junit-ext                   = { group = "androidx.test.ext",     name = "junit",                         version.ref = "junitExt" }
espresso-core               = { group = "androidx.test.espresso", name = "espresso-core",               version.ref = "espresso" }
mockk                       = { group = "io.mockk",              name = "mockk",                         version.ref = "mockk" }
turbine                     = { group = "app.cash.turbine",      name = "turbine",                       version.ref = "turbine" }
coroutines-test             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",       version.ref = "kotlinxCoroutines" }

[plugins]
android-application     = { id = "com.android.application",          version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-kapt             = { id = "org.jetbrains.kotlin.kapt",        version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",   version.ref = "hilt" }
